aid: blink-ledger-systems
name: Blink Ledger Systems
description: >-
  Blink (Blink Ledger Systems Inc.) builds online identity and payment
  technologies for digital publishers. A single Blink account works across
  publishers, giving readers one universal login and frictionless payment so
  they can subscribe, donate, or buy an individual article or podcast with one
  click, or enable autopay for small frequent purchases. Publishers integrate
  three products — Blink Identity, Blink Pay and Blink Donate — through one
  hosted JavaScript SDK that places Blink-managed panels into the page, a
  dashboard-configured User Journeys rules engine, four server-side JSON
  endpoints for OAuth2 login, and a signed webhook notification stream covering
  subscription, payment and donation events. Founded 2017; incorporated in the
  US in 2018 and surfaced in the API Evangelist network as a Polychain
  portfolio company.
