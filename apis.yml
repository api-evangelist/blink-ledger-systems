- aid: blink-ledger-systems-sdk
  name: Blink SDK for JavaScript
  description: >-
    Browser SDK exposing window.blinkSDK. Provides Login with Blink (getAuthorizationCode), subscription
    entitlement checks (isSubscribed, getSubscription, onSubscriptionChange), single-article charging
    (requestPayment), hosted donation and subscription modals, and the variables/functions extension points
    that dashboard-configured User Journeys evaluate against.
