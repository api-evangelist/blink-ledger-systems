method: searched
source: https://docs.blink.net/docs/getting-started/environments.html
docs:
  - https://docs.blink.net/docs/getting-started/environments.html
  - https://docs.blink.net/docs/getting-started/quick-start.html
summary: >-
  Blink publishes two public environments, production and test. The test
  environment is a full parallel deployment — its own user dashboard, merchant
  dashboard, SDK bundle and API host — and processes only test cards. Adding a
  real card number to a test account is explicitly not allowed. Test clientIds
  are issued on request by Blink rather than self-service.
environments:
  - id: production
    live: true
    user_dashboard: https://blink.net
    merchant_dashboard: https://dashboard.blink.net
    sdk: https://blink.net/1.0/blink-sdk.js
    api_base: https://api.blink.net
    note: Uses real cards and processes real money transactions.
  - id: test
    live: false
    user_dashboard: https://test.blink.net
    merchant_dashboard: https://dashboard.test.blink.net
    sdk: https://test.blink.net/1.0/blink-sdk.js
    api_base: https://api.test.blink.net
    note: >-
      Uses only test cards. Adding a real card number to a test account is not
      allowed. Recommended for integrating Blink against a sandbox/test
      instance of your web application before going live.
provisioning:
  self_service: false
  contact: integration@blink.net
  note: >-
    "If you don't have a clientId for our test environment set up yet, contact
    us at integration@blink.net and we'll get you one."
